[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issgen"
version = "0.1.0"
description = "Generate Juki ISS placement programs from Altium P&P + panel YAML + DETEX.mdb"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "pyodbc>=5", "pydantic>=2.7", "pyyaml>=6", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
issgen = "issgen.cli:main"

[tool.setuptools.packages.find]
include = ["issgen*"]

[tool.setuptools.package-data]
issgen = ["data/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["livedb: requires DETEX.mdb + Access driver (deselect with -m 'not livedb')"]
